<svg xmlns="http://www.w3.org/2000/svg" width="980" height="570" viewBox="0 0 980 570" role="img" aria-label="集团上行文：签发、核稿、印发顺序"><rect width="980" height="570" rx="26" fill="#f6f8fa"/><rect x="22" y="22" width="936" height="526" rx="22" fill="white" stroke="#dce2e6"/><text x="58" y="80" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="29" font-weight="700" fill="#17232b">集团上行文：签发、核稿、印发顺序</text><text x="58" y="113" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="15" fill="#687784">仅针对上传IOA清单所述的集团公文，不外推为所有单位统一流程</text><rect x="56" y="169" width="273" height="235" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".25"/><rect x="72" y="188" width="5" height="197" rx="3" fill="#2563eb"/><text x="93" y="217" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="20" font-weight="700" fill="#2563eb">集团名义上行文</text><text x="93" y="260" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">以集团公司党组</text><text x="93" y="296" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">或集团公司名义发文</text><path d="M343 273 h34 m-13 -12 l13 12 -13 12" stroke="#7a8b98" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="377" y="169" width="251" height="235" rx="16" fill="#edfcf4" stroke="#047857" stroke-opacity=".25"/><rect x="393" y="188" width="5" height="197" rx="3" fill="#047857"/><text x="414" y="217" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="20" font-weight="700" fill="#047857">负责人签发</text><text x="414" y="260" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">签发后再进入</text><text x="414" y="296" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">综合部核稿环节</text><path d="M642 273 h34 m-13 -12 l13 12 -13 12" stroke="#7a8b98" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="673" y="169" width="251" height="235" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity=".25"/><rect x="689" y="188" width="5" height="197" rx="3" fill="#b45309"/><text x="710" y="217" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="20" font-weight="700" fill="#b45309">综合部核稿 / 印发</text><text x="710" y="260" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">完成核稿后</text><text x="710" y="296" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">按照流程印发</text><rect x="58" y="492" width="862" height="41" rx="10" fill="#f0f3f5"/><text x="78" y="519" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="17" fill="#465561">要注意“签发后经综合部核稿后印发”的适用对象和限定条件。</text><text x="56" y="526" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="13" fill="#82929c">规范操作示意 · 不是真实IOA系统截图 · 依据《IOA自制公文审核要点及规范操作清单》绘制</text></svg>