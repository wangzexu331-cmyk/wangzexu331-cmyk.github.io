<svg xmlns="http://www.w3.org/2000/svg" width="980" height="570" viewBox="0 0 980 570" role="img" aria-label="附件名称三处必须一致"><rect width="980" height="570" rx="26" fill="#f6f8fa"/><rect x="22" y="22" width="936" height="526" rx="22" fill="white" stroke="#dce2e6"/><text x="58" y="80" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="29" font-weight="700" fill="#17232b">附件名称三处必须一致</text><text x="58" y="113" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="15" fill="#687784">特别防止系统上传附件遗漏、错传及文件名不一致</text><rect x="57" y="160" width="265" height="259" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-opacity=".25"/><rect x="73" y="179" width="5" height="221" rx="3" fill="#2563eb"/><text x="94" y="208" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="20" font-weight="700" fill="#2563eb">① 正文引用</text><text x="94" y="251" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">检查材料目录</text><text x="94" y="287" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">如“附件1：检查表”</text><rect x="357" y="160" width="266" height="259" rx="16" fill="#edfcf4" stroke="#047857" stroke-opacity=".25"/><rect x="373" y="179" width="5" height="221" rx="3" fill="#047857"/><text x="394" y="208" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="20" font-weight="700" fill="#047857">② 附件说明</text><text x="394" y="251" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">附件序号与名称</text><text x="394" y="287" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">和正文引用相对应</text><rect x="658" y="160" width="265" height="259" rx="16" fill="#fffbeb" stroke="#b45309" stroke-opacity=".25"/><rect x="674" y="179" width="5" height="221" rx="3" fill="#b45309"/><text x="695" y="208" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="20" font-weight="700" fill="#b45309">③ IOA上传</text><text x="695" y="251" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">附件栏的文件名</text><text x="695" y="287" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">与前两处保持一致</text><rect x="58" y="492" width="862" height="41" rx="10" fill="#f0f3f5"/><text x="78" y="519" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="17" fill="#465561">上传前检查：编号一致、文件名一致、文件内容没有漏传和错传。</text><text x="56" y="526" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="13" fill="#82929c">规范操作示意 · 不是真实IOA系统截图 · 依据《IOA自制公文审核要点及规范操作清单》绘制</text></svg>