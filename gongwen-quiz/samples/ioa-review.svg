ight="700" fill="#047857">对应正确操作</text><text x="537" y="245" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">① 删除带出标题后正确重排</text><text x="537" y="281" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">② 删除重复表格并重新输入</text><text x="537" y="317" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">③ 拖拽书签到正确位置</text><text x="537" y="353" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">④ 修改发文单，再套红更新</text><text x="537" y="389" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="19" fill="#263541">⑤ 使用系统带出的印发日期</text><text x="56" y="571" font-family='"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif' font-size="13" fill="#82929c">规范操作示意 · 不是真实IOA系统截图 · 依据《IOA自制公文审核要点及规范操作清单》绘制</text></svg>