<style>
:root{--blue:#0865f5;--deep:#102ccb;--ink:#182230;--secondary:#5c6675;--border:#e3e9f1;--canvas:#f5f7fb;--white:#fff;--soft:#edf4ff;--green:#09856c;--danger:#bc3a40;--shadow:0 10px 30px rgba(28,49,81,.065)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei", "PingFang SC",sans-serif;color:var(--ink);font-size:15px;line-height:1.65}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(8,101,245,.24);outline-offset:2px}.top{background:linear-gradient(118deg,#101b36 0%,#182b59 54%,#114fc4 100%);color:#fff;padding:32px 22px 46px}.shell{max-width:1000px;margin:0 auto}.eyebrow{color:#acc6ff;font-size:12px;font-weight:700;letter-spacing:1.5px}.top h1{font-size:29px;letter-spacing:-.7px;line-height:1.3;margin:8px 0}.top p{color:#d4dff2;margin:0;max-width:720px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:21px}.toolbtn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600}.toolbtn:hover{background:rgba(255,255,255,.18)}.toolbtn.primary{background:#fff;color:#123d91;border-color:#fff}.status{color:#d9e7ff;font-size:12px;margin-left:auto}.main{max-width:1000px;margin:-23px auto 0;padding:0 20px 50px;position:relative}.stepper{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:19px 20px}.stephead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.stephead b{font-size:14px}.stephead span{font-size:13px;color:var(--secondary)}.progress{height:8px;background:#e9eff8;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--deep));transition:width .2s}.tabs{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.tab{border:0;background:transparent;color:#708094;font-size:12px;font-weight:600;flex:1;min-width:0;padding:6px 3px;border-radius:8px;text-align:center}.tab.active{background:var(--soft);color:#0759dd}.tab:hover{background:#f4f7fd}.intro{padding:25px 4px 14px}.intro h2{font-size:22px;margin:0 0 4px;line-height:1.4}.intro p{margin:0;color:var(--secondary);font-size:14px}.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:23px 25px;margin:13px 0;box-shadow:0 2px 12px rgba(18,50,93,.025)}.qtitle{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:15px;margin-bottom:5px}.number{display:inline-flex;justify-content:center;align-items:center;min-width:27px;height:27px;background:#eef4ff;color:var(--blue);border-radius:8px;font-size:12px;flex-shrink:0}.req{color:#d34b50;font-size:12px;font-weight:650;margin-left:6px}.tip{color:#69798b;font-size:13px;line-height:1.6;margin:2px 0 12px 37px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-left:37px}.choice{display:flex;align-items:flex-start;gap:9px;border:1px solid #dee5ee;border-radius:10px;padding:10px 12px;cursor:pointer;transition:background .15s,border .15s;background:#fff;min-height:45px}.choice:hover{border-color:#bad2ff}.choice:has(input:checked){background:#eef5ff;border-color:#7fafff;color:#084db8}.choice input{accent-color:var(--blue);width:17px;height:17px;flex-shrink:0;margin:3px 0 0}.choice span{font-size:13px;line-height:1.4}.widefield{margin-left:37px}.field,textarea,select{width:100%;border:1px solid #d8e1ed;background:#fff;color:var(--ink);padding:11px 12px;border-radius:10px;min-width:0}.field::placeholder,textarea::placeholder{color:#a0acb9}textarea{resize:vertical;min-height:105px}.textsmall{color:var(--secondary);font-size:12px;margin-top:7px}.subfield{margin:13px 0 0 37px}.subfield label{display:block;font-size:13px;font-weight:600;color:#45546a;margin-bottom:6px}.feature-row{border:1px solid #dce5f1;border-radius:12px;background:#fafcff;padding:15px;margin-bottom:11px}.feature-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.feature-top strong{font-size:13px}.feature-top button{border:0;background:transparent;color:var(--danger);font-size:12px}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.fgrid .full{grid-column:1/-1}.fgrid label{display:block;font-size:12px;font-weight:650;color:#465b75;margin-bottom:5px}.fgrid textarea{min-height:83px}.mini{font-size:12px;color:#708097}.light-btn{padding:9px 13px;background:#fff;border:1px solid #a8c8f8;color:#0659e0;border-radius:9px;font-size:13px;font-weight:700}.light-btn:hover{background:var(--soft)}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}.navbutton{border:1px solid var(--border);background:#fff;border-radius:11px;padding:11px 23px;font-weight:700;min-width:110px;color:var(--ink)}.navbutton.blue{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(8,101,245,.16)}.navbutton:hover{filter:brightness(.96)}.bottom small{color:var(--secondary)}.footer{color:#748295;font-size:12px;text-align:center;margin:30px auto 8px;max-width:800px}.toast{position:fixed;z-index:100;left:50%;bottom:28px;transform:translateX(-50%);background:#16325b;color:#fff;border-radius:10px;padding:10px 18px;box-shadow:0 8px 25px #0002;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;max-width:92vw}.toast.show{opacity:1}.small-info{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:#bcd2f7;background:rgba(255,255,255,.08);padding:5px 10px;border-radius:50px;margin-top:12px}.modal{position:fixed;inset:0;background:rgba(19,30,53,.48);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{max-width:480px;width:100%;background:#fff;border-radius:18px;padding:25px;box-shadow:0 18px 70px #0003}.dialog h3{margin:0 0 9px}.dialog p{color:var(--secondary);margin:0 0 18px}.dialog .actions{display:flex;flex-wrap:wrap;gap:10px}.dialog button{padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:#fff}.dialog button.danger{background:#bc3a40;color:white;border-color:#bc3a40}.note{background:#fff8e9;border:1px solid #f4e1b8;color:#806028;padding:11px 13px;border-radius:10px;margin:14px 0;font-size:13px}
@media(max-width:640px){.top{padding:23px 16px 45px}.top h1{font-size:23px}.toolbar{gap:7px}.toolbtn{font-size:12px;padding:7px 10px}.status{width:100%;margin:0}.main{padding:0 12px 38px}.stepper{padding:15px 13px}.tab{font-size:11px}.intro{padding:22px 4px 10px}.intro h2{font-size:20px}.card{padding:17px 13px;margin:10px 0}.tip,.widefield,.choices,.subfield{margin-left:0}.choices{grid-template-columns:1fr}.qtitle{font-size:14px}.fgrid{grid-template-columns:1fr}.fgrid .full{grid-column:auto}.bottom small{display:none}.navbutton{min-width:94px;padding:10px 15px}.feature-row{padding:12px}.dialog{padding:20px}}
@media print{body{background:#fff}.top{background:#fff;color:#000;padding:0}.top p,.top .eyebrow{color:#333}.toolbar,.stepper,.bottom,.toast,.footer{display:none!important}.main{padding:0;margin:0}.card{box-shadow:none;break-inside:avoid}button{display:none!important}.intro{padding:16px 0}body.printing .stepper{display:none}}
</style>

<body>
<header class="top"><div class="shell">
<div class="eyebrow">SOFTWARE REQUIREMENTS SURVEY</div>
<h1>Windows 桌面软件需求调研</h1>
<p>用真实使用场景描述你的想法，不需要懂编程。问卷支持跳题、暂存和随时导出，未确定的内容可以不填。</p>
<div class="small-info">✓ 4 个步骤　✓ 无需联网　✓ 可导出答卷　✓ 支持手机/电脑</div>
<div class="toolbar">
<button class="toolbtn primary" id="exportText" type="button">↓ 下载答卷（TXT）</button>
<button class="toolbtn" id="exportJson" type="button">保存填写进度</button>
<button class="toolbtn" id="copyBtn" type="button">复制答卷内容</button>
<button class="toolbtn" id="importBtn" type="button">导入已有答卷</button>
<button class="toolbtn" id="resetBtn" type="button">重新填写</button>
<span class="status" id="saveStatus" aria-live="polite">正在准备问卷…</span>
</div>
</div></header>
<main class="main">
<section class="stepper" aria-label="问卷进度"><div class="stephead"><b id="stepCount">第 1 / 4 步</b><span id="progressText">填写基本情况</span></div><div class="progress"><div id="progressBar" style="width:25%"></div></div><div class="tabs" id="tabs"></div></section>
<section class="intro" id="intro"></section>
<form id="survey" novalidate></form>
<nav class="bottom" aria-label="分页"><button type="button" class="navbutton" id="prevBtn">← 上一步</button><small>答案会尝试自动保存到当前浏览器；跨设备请下载文件。</small><button type="button" class="navbutton blue" id="nextBtn">下一步 →</button></nav>
<div class="footer">仅供需求调研使用。本问卷不会向服务器上传任何数据。更换浏览器或清除浏览器数据可能丢失未导出的回答。</div>
</main>
<div role="status" aria-live="polite" class="toast" id="toast"></div>
<div class="modal" id="resetDialog" role="dialog" aria-modal="true" aria-labelledby="resetTitle"><div class="dialog"><h3 id="resetTitle">重新填写问卷？</h3><p>这会清空本浏览器中已经填写的内容。建议先下载答卷或保存填写进度。</p><div class="actions"><button type="button" id="cancelReset">取消</button><button class="danger" type="button" id="confirmReset">确认清空</button></div></div></div>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<script>
(function(){'use strict';
const KEY='windows-desktop-survey-v2';
const steps=[
{title:'基本情况',sub:'先讲清楚为什么做、给谁用，以及期望的操作过程。',qs:[
{id:'name',title:'填写人 / 联系方式（选填）',type:'text',placeholder:'姓名或称呼；如不方便可以留空'},
{id:'goal',title:'为什么想开发这款软件？',hint:'请描述目前遇到的具体麻烦，以及最希望解决的一个问题。',type:'textarea',placeholder:'例如：现在需要在几个工具之间反复切换，处理相同资料时要重复操作……',important:true},
{id:'product',title:'这款软件更接近下面哪种定位？',type:'multi',options:['个人综合工作台','现有软件/脚本的集中启动工具箱','一个软件包含多个业务功能','文件、文档和资料管理工具','可以持续增加功能的模块化平台','其他/尚不确定']},
{id:'users',title:'主要由谁使用？',type:'single',options:['仅自己使用','自己和少量同事使用','一个部门或小团队使用','多个部门共同使用','尚不确定']},
{id:'scenario',title:'描述一次理想的完整使用过程',hint:'按“打开软件 → 选择功能 → 输入什么 → 处理什么 → 得到什么结果”写即可。',type:'textarea',placeholder:'打开软件 → 进入…… → 选择…… → 导出……'}
]},
{title:'功能清单',sub:'这部分最重要。先写必须做的功能，不必担心技术上能否实现。',qs:[
{id:'features',title:'希望有哪些具体功能？',type:'features',hint:'每张卡片写一个功能。至少写出最想实现的一个；可继续添加。尽量举实际工作例子。',important:true},
{id:'files',title:'需要处理哪类文件或输入输出？',type:'multi',options:['Word / DOCX','Excel / XLSX / CSV','PDF','图片 / 扫描件','已有数据库或记录','现有软件导出的数据','不需要处理文件','暂不确定']},
{id:'references',title:'目前有没有可参考的现有材料？',type:'multi',options:['已有软件或小工具','Excel / Word 工作模板','相关流程说明','界面截图或草图','参考软件网址','暂无参考资料']},
{id:'referencesNotes',title:'参考材料或现有工具的名称（选填）',type:'textarea',placeholder:'可列软件名称、现有操作方式，或说明之后会另外发送哪些文件。'}
]},
{title:'模块与界面',sub:'确认“功能独立”究竟指什么，避免后续架构选错。',qs:[
{id:'integration',title:'你希望如何打开各项功能？',type:'single',options:['所有功能都在同一个主窗口/标签页内','点击后打开新的独立窗口','点击后直接启动外部 EXE / 工具','几种方式结合，视功能而定','不确定，以好用为主'],important:true},
{id:'extension',title:'以后增加或修改功能，最希望怎样操作？',type:'single',options:['升级整个主程序即可','新增/替换某个模块，主程序尽量不变','像安装插件一样导入和移除','自己编写小工具后直接接入','暂不确定']},
{id:'sharing',title:'不同模块之间需要怎样关联？',type:'multi',options:['只共用一个主界面，不需要交换数据','共用文件与资料','共用一些设置或配置','A模块的结果能传给B模块','模块之间完全独立','目前无法确定']},
{id:'existing',title:'已经有哪些工具想接入？',type:'multi',options:['没有，全部新开发','EXE / Windows 软件','Python 脚本','网页 / HTML 工具','Excel VBA / 宏','命令行脚本 / 批处理','其他类型程序']},
{id:'existingDetails',title:'已有工具的名称及用途（选填）',type:'textarea',placeholder:'例如：某个 Python 脚本用于批量生成报表；某个独立 EXE 用于信息查询……'},
{id:'ui',title:'你偏好的界面布局是？',type:'single',options:['左侧导航栏 + 右侧内容区域','首页卡片/图标，点击进入功能','顶部菜单 + 多标签页','类似 Windows 资源管理器','没有偏好，优先简单清晰']},
{id:'experience',title:'哪些操作体验比较重要？',type:'multi',options:['打开速度快','操作步骤少','支持搜索功能','深色/浅色模式','多个功能同时打开','快捷键','可调整窗口大小','最小化到托盘','自定义界面布局']}
]},
{title:'环境与交付',sub:'最后明确运行限制和第一版验收标准，便于设计开发计划。',qs:[
{id:'os',title:'主要使用什么操作系统？',type:'multi',options:['Windows 10','Windows 11','Windows 7','其他/不确定']},
{id:'network',title:'运行电脑的联网情况？',type:'single',options:['一直可以联网','完全离线','有时联网、有时离线','仅能使用单位内网','不确定']},
{id:'admin',title:'电脑有没有软件安装或管理员权限？',type:'single',options:['有，能自由安装软件','没有或受到单位限制','不确定']},
{id:'data',title:'软件需要保存或共享什么信息？',type:'multi',options:['只存软件配置','业务数据、历史记录','文件与附件','保存导出结果','自动备份/恢复','多台电脑迁移','多人共享/协同使用','暂不确定']},
{id:'security',title:'软件涉及哪种数据？',type:'single',options:['普通个人资料或公开内容','单位内部资料','个人隐私或敏感业务数据','涉密或有严格安全要求的数据','目前无法确认']},
{id:'install',title:'希望怎样安装或交付？',type:'single',options:['免安装，解压即可运行','标准安装包','两种都支持','没有偏好']},
{id:'update',title:'希望未来怎样升级？',type:'single',options:['手动替换整个程序','仅替换需要更新的模块','下载安装离线更新包','联网自动更新','暂无要求']},
{id:'mvp',title:'第一版完成到什么程度，你就愿意实际开始使用？',hint:'建议写出最重要的1—3个具体操作，以及你判断“能用”的标准。',type:'textarea',placeholder:'例如：能正常运行；第一个功能从输入到导出跑通；数据重启后仍然保留……',important:true},
{id:'special',title:'还有哪些特殊要求、顾虑或未来想法？（选填）',type:'textarea',placeholder:'例如：希望通过 AI 辅助开发、后期独自维护、减少占用、禁止联网、特别重视数据安全……'}
]}];
const featureTemplate=()=>({name:'',description:'',io:'',frequency:'尚不确定',priority:'必须实现'});
let state={answers:{},features:[featureTemplate()],step:0,updatedAt:null};
let storageOk=true,toastTimer=null;
const $=(s)=>document.querySelector(s),$$=(s)=>Array.from(document.querySelectorAll(s));
const e=(s)=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const allQs=steps.flatMap(s=>s.qs);
function load(){try{let data=JSON.parse(localStorage.getItem(KEY)||'null');if(data && typeof data==='object'){state={answers:(data.answers && typeof data.answers==='object')?data.answers:{},features:Array.isArray(data.features)?data.features.slice(0,30):[featureTemplate()],step:Number.isInteger(data.step)?Math.min(3,Math.max(0,data.step)):0,updatedAt:data.updatedAt||null};if(!state.features.length)state.features=[featureTemplate()];}}catch(_){storageOk=false;}}
function save(){state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));storageOk=true;}catch(_){storageOk=false;}setStatus();}
function setStatus(){const x=$('#saveStatus');if(storageOk){x.textContent='● 已保存于本机（建议导出备份）';}else{x.textContent='⚠ 当前环境不能自动保存，请下载答卷';}}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3100);}
function renderQuestion(q,i){let h=`<article class="card"><div class="qtitle"><span class="number">${String(allQs.indexOf(q)+1).padStart(2,'0')}</span><span>${e(q.title)}${q.important?'<span class="req">重点填写</span>':''}</span></div>${q.hint?`<p class="tip">${e(q.hint)}</p>`:''}`;
const val=state.answers[q.id];
if(q.type==='text')h+=`<div class="widefield"><input class="field" type="text" name="${q.id}" value="${e(val||'')}" placeholder="${e(q.placeholder||'')}" autocomplete="off"></div>`;
if(q.type==='textarea')h+=`<div class="widefield"><textarea name="${q.id}" placeholder="${e(q.placeholder||'')}" rows="4">${e(val||'')}</textarea></div>`;
if(q.type==='single'||q.type==='multi'){
 h+=`<div class="choices" role="group" aria-label="${e(q.title)}">`;
 q.options.forEach((option,j)=>{const checked=q.type==='single'?val===option:(Array.isArray(val)&&val.includes(option));h+=`<label class="choice"><input type="${q.type==='single'?'radio':'checkbox'}" name="${q.id}" value="${e(option)}" ${checked?'checked':''}><span>${e(option)}</span></label>`;});
 h+='</div>';}
if(q.type==='features')h+=`<div class="widefield" id="featuresArea"></div>`;
return h+'</article>';}
function renderFeatures(){let html='';state.features.forEach((f,i)=>{html+=`<div class="feature-row" data-feature="${i}"><div class="feature-top"><strong>功能 ${i+1}</strong>${state.features.length>1?`<button type="button" data-remove="${i}">删除此功能</button>`:''}</div><div class="fgrid"><div class="full"><label>功能名称 ${i===0?'<span class="req">重点</span>':''}</label><input class="field" data-fi="${i}" data-fk="name" type="text" placeholder="例如：文件批量整理、数据查询、报表生成" value="${e(f.name)}"></div><div class="full"><label>具体用途 / 想解决的问题</label><textarea data-fi="${i}" data-fk="description" placeholder="例如：选择文件夹后，按照指定规则完成分类和重命名">${e(f.description)}</textarea></div><div class="full"><label>输入什么、得到什么结果？</label><input class="field" data-fi="${i}" data-fk="io" type="text" placeholder="例如：输入Excel台账 → 输出统计表" value="${e(f.io)}"></div><div><label>使用频率</label><select data-fi="${i}" data-fk="frequency">${['尚不确定','每天','每周','每月','偶尔'].map(s=>`<option ${f.frequency===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>优先级</label><select data-fi="${i}" data-fk="priority">${['必须实现','希望有','以后再做','尚不确定'].map(s=>`<option ${f.priority===s?'selected':''}>${s}</option>`).join('')}</select></div></div></div>`;});html+='<button type="button" id="addFeature" class="light-btn">＋ 增加一个功能</button><div class="textsmall">建议按重要程度排序，首先写最希望第一版实现的功能。</div>';$('#featuresArea').innerHTML=html;}
function render(){const st=steps[state.step];$('#stepCount').textContent=`第 ${state.step+1} / ${steps.length} 步`;$('#progressText').textContent=st.title;$('#progressBar').style.width=`${(state.step+1)/steps.length*100}%`;$('#tabs').innerHTML=steps.map((s,i)=>`<button type="button" class="tab ${state.step===i?'active':''}" data-step="${i}" ${state.step===i?'aria-current="step"':''}>${i+1}. ${e(s.title)}</button>`).join('');$('#intro').innerHTML=`<h2>${e(st.title)}</h2><p>${e(st.sub)}</p>`;$('#survey').innerHTML=st.qs.map(renderQuestion).join('');if(st.qs.some(q=>q.type==='features'))renderFeatures();$('#prevBtn').style.visibility=state.step===0?'hidden':'visible';$('#nextBtn').textContent=state.step===steps.length-1?'填写完毕，导出答卷 ↓':'下一步 →';setStatus();}
function capture(){const form=$('#survey');for(const q of steps[state.step].qs){if(q.type==='features')continue;const els=Array.from(form.querySelectorAll(`[name="${q.id}"]`));if(!els.length)continue;let answer;if(q.type==='multi')answer=els.filter(el=>el.checked).map(el=>el.value);else if(q.type==='single')answer=(els.find(el=>el.checked)||{}).value||'';else answer=els[0].value;state.answers[q.id]=answer;}form.querySelectorAll('[data-fi][data-fk]').forEach(el=>{const idx=Number(el.dataset.fi),key=el.dataset.fk;if(state.features[idx])state.features[idx][key]=el.value;});save();}
function stepTo(i){capture();state.step=Math.max(0,Math.min(steps.length-1,i));save();render();window.scrollTo({top:0,behavior:'smooth'});}
function answerText(){capture();const time=new Date().toLocaleString('zh-CN',{hour12:false});const lines=['Windows 桌面软件需求调研问卷','填写时间：'+time,'说明：空白表示未填写；本文件由离线问卷生成。',''];for(const [si,st] of steps.entries()){lines.push(`【第${si+1}部分：${st.title}】`);for(const q of st.qs){lines.push('');lines.push(q.title);if(q.type==='features'){state.features.forEach((f,i)=>{lines.push(`  功能 ${i+1}：${f.name||'（未填写）'}`);lines.push(`  具体用途：${f.description||'（未填写）'}`);lines.push(`  输入输出：${f.io||'（未填写）'}`);lines.push(`  使用频率：${f.frequency||'（未选择）'}；优先级：${f.priority||'（未选择）'}`);});}else{const v=state.answers[q.id];lines.push(Array.isArray(v)?(v.length?v.map(x=>'☑ '+x).join('；'):'（未填写）'):(v&&v.trim()?v:'（未填写）'));}}lines.push('');}return lines.join('\n');}
function download(filename,content,mime){const blob=new Blob(['\ufeff',content],{type:mime});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function stamp(){const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;}
$('#survey').addEventListener('input',capture);$('#survey').addEventListener('change',capture);
$('#survey').addEventListener('click',evt=>{const rem=evt.target.closest('[data-remove]');if(rem){capture();state.features.splice(Number(rem.dataset.remove),1);if(!state.features.length)state.features.push(featureTemplate());save();renderFeatures();toast('已删除功能卡片');return;}if(evt.target.closest('#addFeature')){capture();if(state.features.length>=20){toast('最多支持20个功能');return;}state.features.push(featureTemplate());save();renderFeatures();$('#featuresArea .feature-row:last-of-type input')?.focus();}});
$('#tabs').addEventListener('click',ev=>{const t=ev.target.closest('[data-step]');if(t)stepTo(Number(t.dataset.step));});
$('#prevBtn').addEventListener('click',()=>stepTo(state.step-1));$('#nextBtn').addEventListener('click',()=>{if(state.step===steps.length-1){download(`软件需求问卷_答卷_${stamp()}.txt`,answerText(),'text/plain;charset=utf-8');toast('答卷已导出，请将 TXT 文件发送给需求整理人');}else stepTo(state.step+1);});
$('#exportText').addEventListener('click',()=>{download(`软件需求问卷_答卷_${stamp()}.txt`,answerText(),'text/plain;charset=utf-8');toast('答卷已生成，可直接转发 TXT 文件');});
$('#exportJson').addEventListener('click',()=>{capture();download(`软件需求问卷_进度备份_${stamp()}.json`,JSON.stringify({form:'windows-desktop-software-requirements',version:2,...state},null,2),'application/json;charset=utf-8');toast('已导出进度文件，下次可导入继续填写');});
$('#copyBtn').addEventListener('click',async()=>{const t=answerText();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);}else{let el=document.createElement('textarea');el.value=t;document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw new Error('copy failed');}toast('已复制完整答卷，可粘贴到微信或文档');}catch(err){download(`软件需求问卷_答卷_${stamp()}.txt`,t,'text/plain;charset=utf-8');toast('无法直接复制，已改为下载TXT答卷');}});
$('#importBtn').addEventListener('click',()=>$('#importFile').click());$('#importFile').addEventListener('change',async(ev)=>{const file=ev.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d||typeof d!=='object'||!d.answers||!Array.isArray(d.features)||!(d.form==='windows-desktop-software-requirements'))throw Error('不是本问卷的进度文件');capture();state={answers:d.answers,features:d.features.slice(0,20),step:Number.isInteger(d.step)?Math.min(3,Math.max(0,d.step)):0,updatedAt:d.updatedAt||null};if(!state.features.length)state.features=[featureTemplate()];save();render();toast('进度已恢复，可以继续填写');}catch(err){toast('导入失败：请选择本问卷导出的 JSON 进度文件');}finally{ev.target.value='';}});
$('#resetBtn').addEventListener('click',()=>$('#resetDialog').classList.add('open'));$('#cancelReset').addEventListener('click',()=>$('#resetDialog').classList.remove('open'));$('#resetDialog').addEventListener('click',ev=>{if(ev.target.id==='resetDialog')$('#resetDialog').classList.remove('open');});$('#confirmReset').addEventListener('click',()=>{state={answers:{},features:[featureTemplate()],step:0,updatedAt:null};save();render();$('#resetDialog').classList.remove('open');toast('已清空，开始重新填写');window.scrollTo({top:0,behavior:'smooth'});});
load();render();
})();
</script>
</body>
</html>
